name: Integration Tests

# Integration tests spawn real sf.py subprocesses and may hit the network.
# They are intentionally outside the pull-request gate.

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-mock pytest-cov responses
      - name: Run integration tests
        run: |
          python -m pytest test/integration --ignore=test/integration/modules/ --durations=10
