name: Dependency Audit

on:
  push:
    branches: [main, master]
    paths:
      - requirements.txt
      - test/requirements.txt
      - .github/workflows/dependency-audit.yml
  pull_request:
    branches: [main, master]
    paths:
      - requirements.txt
      - test/requirements.txt
      - .github/workflows/dependency-audit.yml
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (known CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade "pip-audit==2.10.1"

      - name: Audit runtime dependencies
        run: pip-audit --strict --progress-spinner off -r requirements.txt
